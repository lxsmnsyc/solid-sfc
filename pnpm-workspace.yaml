packages:
  - packages/*
  - examples/*
  - website
minimumReleaseAgeExclude:
  - '@solidjs/signals@2.0.0-rc.15'
  - '@solidjs/web@2.0.0-rc.15'
  - solid-js@2.0.0-rc.15
# Only needed to sign extensions, not to package them.
allowBuilds:
  '@vscode/vsce-sign': false
  keytar: false
  '@parcel/watcher': false
  # The tests use its JavaScript API, which works without its install script.
  esbuild: false
